<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GameHubPortal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg"></div>

<header>
  <h1>🎮 GameHubPortal</h1>
  <input type="text" placeholder="Search games...">
</header>

<section class="hero">
  <h2>Welcome to GameHubPortal</h2>
  <p>Your gateway to unlimited gaming</p>
</section>

<section class="games">

  <div class="card">
    <img src="https://picsum.photos/300/180?1">
    <div class="overlay">
      <h3>Cyber Run</h3>
      <button>Play</button>
    </div>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/180?2">
    <div class="overlay">
      <h3>Zombie War</h3>
      <button>Play</button>
    </div>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/180?3">
    <div class="overlay">
      <h3>Speed Drift</h3>
      <button>Play</button>
    </div>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/180?4">
    <div class="overlay">
      <h3>Space Battle</h3>
      <button>Play</button>
    </div>
  </div>

</section>

</body>
</html>
